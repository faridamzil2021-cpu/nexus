<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS ROYALE — Google Sign-In</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b14;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(380px, 90vw);
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 18px;
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.45;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #ffffff;
        color: #0f172a;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .err {
        margin-top: 12px;
        color: #fda4af;
        font-size: 12px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>NEXUS ROYALE</h1>
      <p id="status-text">Connecting to Google Authentication...</p>
      <button id="retry-btn" type="button">Continue with Google</button>
      <div id="err-text" class="err"></div>
    </div>
    <script type="module" src="/src/desktop/desktopAuthBridge.ts"></script>
  </body>
</html>
